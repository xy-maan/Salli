name: Emulator test (real alarms, ~8 min)
# Run manually: Actions tab -> "Emulator test" -> Run workflow.
on:
  workflow_dispatch:
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/emulator-test.sh
      - name: Show result on the run page
        if: always()
        run: |
          {
            echo '## Emulator test result'
            echo '```'
            cat ci-output/summary.txt 2>/dev/null || echo 'no summary produced'
            echo '```'
            echo '### Last log lines'
            echo '```'
            tail -n 60 ci-output/salli.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-output
          path: ci-output
